# Disable Wi-Fi power saving in NetworkManager.
# Power saving makes the Wi-Fi card sleep between packets, which breaks
# phone-to-laptop remotes such as KDE Connect.
#
# Install:
#   sudo cp wifi-powersave-off.conf /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
#   sudo systemctl restart NetworkManager
#
# Values: 0 = default, 1 = ignore, 2 = disable, 3 = enable
[connection]
wifi.powersave = 2
